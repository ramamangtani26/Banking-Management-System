spring.application.name=banking-backend
server.port=${PORT:8080}

# Default (local) database: file-based H2. Production uses the "prod" profile (PostgreSQL).
spring.datasource.url=jdbc:h2:file:./data/bankdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# No auto-generated default user/password; we use our own JWT login
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Admin login (override with env vars in production!)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}

# JWT (JWT_SECRET must be 32+ characters in production)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}

# Comma-separated list of allowed frontend origins, e.g. https://my-bank.netlify.app
app.cors.allowed-origins=${CORS_ORIGINS:*}

management.endpoints.web.exposure.include=health
